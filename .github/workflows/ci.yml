name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend and integration projects
        run: |
          dotnet restore lead-management-platform.sln
          dotnet restore LeadManager.Tests.Integration/LeadManager.Tests.Integration.csproj

      - name: Build backend and integration projects
        run: |
          dotnet build lead-management-platform.sln --no-restore --configuration Release
          dotnet build LeadManager.Tests.Integration/LeadManager.Tests.Integration.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test LeadManager.Tests.Unit/LeadManager.Tests.Unit.csproj --configuration Release --no-build --verbosity normal

      - name: Run integration tests
        run: dotnet test LeadManager.Tests.Integration/LeadManager.Tests.Integration.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LeadManager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  containers:
    name: Container Definitions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config

      - name: Build API and frontend images
        run: docker compose build api worker frontend

  kubernetes:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Render kustomization
        run: |
          kubectl kustomize k8s > /tmp/k8s-rendered.yaml
          test -s /tmp/k8s-rendered.yaml
