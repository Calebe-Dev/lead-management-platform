services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lead_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_manager"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: LeadManager.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LeadManagerDatabase: Host=postgres;Port=5432;Database=lead_manager;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: lead-manager-api
      Jwt__Audience: lead-manager-clients
      Jwt__SigningKey: lead-manager-super-secret-signing-key-12345
      Jwt__ExpiresInMinutes: 60
      Auth__Users__0__Username: admin
      Auth__Users__0__Password: admin123!
      Auth__Users__0__Role: admin
      Auth__Users__1__Username: marketing
      Auth__Users__1__Password: marketing123!
      Auth__Users__1__Role: marketing
      Auth__Users__2__Username: vendas
      Auth__Users__2__Password: vendas123!
      Auth__Users__2__Role: vendas
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: LeadManager/Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
