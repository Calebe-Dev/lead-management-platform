apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lead-manager-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: lead-manager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lead-manager-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lead-manager-api
                port:
                  number: 8080
